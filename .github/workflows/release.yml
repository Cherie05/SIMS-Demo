# Continuous delivery: a version tag (v1.2.3) publishes signed images and walks them through
# staging -> (manual approval) -> production, with smoke tests and automatic rollback.
#
# One-time setup (repository settings):
#   Environments "staging" and "production"; production with required reviewers (the approval gate).
#   Secrets per environment: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS, PUBLIC_URL.
#   Each server has the repository checked out in /opt/sims with its production.env (never in git).
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  quality:
    name: Required release checks
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      security-events: write
      pull-requests: read

  publish:
    name: Build, sign and publish images
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing (Sigstore) and provenance
      attestations: write
    outputs:
      backend: ${{ steps.backend.outputs.digest }}
      frontend: ${{ steps.frontend.outputs.digest }}
      image_prefix: ${{ steps.images.outputs.prefix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Normalize registry image names
        id: images
        run: |
          image_prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf 'prefix=%s\n' "$image_prefix" >> "$GITHUB_OUTPUT"
          printf 'IMAGE_PREFIX=%s\n' "$image_prefix" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - id: meta-backend
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_PREFIX }}/backend
          tags: type=semver,pattern={{version}}
      - id: backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          build-args: APP_VERSION=${{ github.ref_name }}
          provenance: mode=max
          sbom: true

      - id: meta-frontend
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_PREFIX }}/frontend
          tags: type=semver,pattern={{version}}
      - id: frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          build-args: APP_VERSION=${{ github.ref_name }}
          provenance: mode=max
          sbom: true

      - name: Sign images (keyless, Sigstore)
        run: |
          cosign sign --yes "${IMAGE_PREFIX}/backend@${{ steps.backend.outputs.digest }}"
          cosign sign --yes "${IMAGE_PREFIX}/frontend@${{ steps.frontend.outputs.digest }}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}/backend
          subject-digest: ${{ steps.backend.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}/frontend
          subject-digest: ${{ steps.frontend.outputs.digest }}
          push-to-registry: true

  staging:
    name: Deploy to staging
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Deploy (pinned digests) and smoke test
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
          RELEASE: ${{ github.ref_name }}
          BACKEND_IMAGE: ${{ needs.publish.outputs.image_prefix }}/backend@${{ needs.publish.outputs.backend }}
          FRONTEND_IMAGE: ${{ needs.publish.outputs.image_prefix }}/frontend@${{ needs.publish.outputs.frontend }}
        run: sh ops/ci-deploy.sh

  production:
    name: Deploy to production
    needs: [publish, staging]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production # required reviewers = the release approval gate
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Deploy (pinned digests), smoke test, roll back on failure
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
          RELEASE: ${{ github.ref_name }}
          BACKEND_IMAGE: ${{ needs.publish.outputs.image_prefix }}/backend@${{ needs.publish.outputs.backend }}
          FRONTEND_IMAGE: ${{ needs.publish.outputs.image_prefix }}/frontend@${{ needs.publish.outputs.frontend }}
        run: sh ops/ci-deploy.sh
