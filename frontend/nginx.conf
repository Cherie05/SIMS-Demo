# nginx config template (rendered by the image's entrypoint: ${NGINX_*} come from the environment).
#   NGINX_BACKEND          API upstream (host:port)
#   NGINX_RESOLVER         DNS server for the upstream name (Docker: 127.0.0.11)
#   NGINX_TRUSTED_PROXY    address/CIDR of a proxy in front (e.g. the TLS edge) whose X-Forwarded-For
#                          is believed; 127.0.0.1 = nothing in front, the client address is used as is.

# Correlation id: keep a well-formed one from the edge/load balancer, otherwise mint one here.
map $http_x_request_id $sims_request_id {
    "~^[A-Za-z0-9._:-]{8,128}$" $http_x_request_id;
    default $request_id;
}

# Accept the original HTTPS scheme only from the configured TLS proxy.
geo $realip_remote_addr $sims_trusted_proxy {
    default 0;
    ${NGINX_TRUSTED_PROXY} 1;
}
map "$sims_trusted_proxy:$http_x_forwarded_proto" $sims_forwarded_proto {
    "1:https" https;
    default $scheme;
}

# One JSON object per line; $uri has no query string, so search terms never reach the log.
log_format sims_json escape=json
    '{"timestamp":"$time_iso8601","service":"sims-web","request_id":"$sims_request_id",'
    '"client_ip":"$remote_addr","method":"$request_method","path":"$uri","status":$status,'
    '"bytes":$body_bytes_sent,"duration_s":$request_time,"upstream_s":"$upstream_response_time",'
    '"user_agent":"$http_user_agent"}';

# Coarse flood protection at the edge (the API also limits per user and per account)
limit_req_zone $binary_remote_addr zone=sims_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=sims_auth:10m rate=5r/s;
limit_req_status 429;
limit_conn_zone $binary_remote_addr zone=sims_conn:10m;

# Re-resolve the API name every 10 s, so replicas added with `--scale backend=N` get traffic
# without restarting nginx (Docker's embedded DNS answers with every replica).
resolver ${NGINX_RESOLVER} valid=10s ipv6=off;

upstream sims_backend {
    zone sims_backend 64k;
    server ${NGINX_BACKEND} resolve;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    access_log /dev/stdout sims_json;
    error_log /dev/stderr warn;

    # Real client address when a trusted proxy (the TLS edge) is in front
    set_real_ip_from ${NGINX_TRUSTED_PROXY};
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 30s;
    limit_conn sims_conn 50;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # nginx's own liveness probe (container health check)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Sign-in endpoints get a tighter budget than the rest of the API
    location /api/v1/auth/ {
        limit_req zone=sims_auth burst=20 nodelay;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    # API requests go to the FastAPI container (which sets its own security headers)
    location /api/ {
        limit_req zone=sims_api burst=60 nodelay;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    # Errors generated before the API answers keep the same JSON contract and correlation id.
    location @api_unavailable {
        internal;
        default_type application/json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "5" always;
        return 503 '{"error":{"code":"SERVICE_UNAVAILABLE","message":"The service is temporarily unavailable. Please try again.","details":null,"request_id":"$sims_request_id"}}';
    }
    location @api_too_large {
        internal;
        default_type application/json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        return 413 '{"error":{"code":"REQUEST_TOO_LARGE","message":"The request is too large.","details":null,"request_id":"$sims_request_id"}}';
    }
    location @api_rate_limited {
        internal;
        default_type application/json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "1" always;
        return 429 '{"error":{"code":"RATE_LIMITED","message":"Too many requests. Please wait and try again.","details":null,"request_id":"$sims_request_id"}}';
    }

    # Hashed build assets can be cached forever
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Client-side routing: unknown paths serve the SPA. index.html itself is never cached,
    # so a new deploy is picked up on the next page load.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
