# Shared by the /api locations.
proxy_pass http://sims_backend;
proxy_http_version 1.1;
proxy_set_header Connection "";
# The API never builds URLs from Host (links in emails come from FRONTEND_URL; trailing-slash
# redirects are off), so a forged Host header has nothing to poison.
proxy_set_header Host $host; # nosemgrep: request-host-used
proxy_set_header X-Request-ID $sims_request_id;
proxy_set_header X-Real-IP $remote_addr;
# Overwrite (don't append to) any client-supplied value: the backend uses this for per-IP limits,
# so clients must not be able to spoof it. $remote_addr is already the real client when a trusted
# proxy is in front (set_real_ip_from).
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $sims_forwarded_proto;
error_page 413 =413 @api_too_large;
error_page 429 =429 @api_rate_limited;
error_page 502 503 504 =503 @api_unavailable;
proxy_connect_timeout 5s;
proxy_send_timeout 30s;
proxy_read_timeout 30s;
# POSTs are never retried on another upstream (non-idempotent); only connection failures are.
proxy_next_upstream error timeout;
proxy_next_upstream_tries 2;
proxy_buffering on;
